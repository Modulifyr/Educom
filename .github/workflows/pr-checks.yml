# .github/workflows/pr-checks.yml
# ───────────────────────────────────────────────────────────────────────────
# Runs on every PR. Three jobs:
#
#   1. validate-title — enforces Conventional Commits format on PR titles
#   2. check-size     — labels PRs by size (XS/S/M/L/XL) and warns on XL
#   3. auto-assign    — auto-assigns the PR to the author
# ───────────────────────────────────────────────────────────────────────────

name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  # ── 1. Validate PR title follows Conventional Commits ──────────────────────
  validate-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            style
            ci
          requireScope: false
          subjectPattern: ^.{1,72}$
          subjectPatternError: 'PR title must be under 72 characters'

  # ── 2. Label PR by size and warn if too large ────────────────────────────
  check-size:
    name: Check PR Size
    runs-on: ubuntu-latest
    steps:
      - name: Label by size
        uses: CodelyTV/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size: XS'
          xs_max_size: 10
          s_label: 'size: S'
          s_max_size: 50
          m_label: 'size: M'
          m_max_size: 200
          l_label: 'size: L'
          l_max_size: 400
          xl_label: 'size: XL'
          fail_if_xl: false
          message_if_xl: |
            This PR is very large (400+ lines changed).
            Please consider splitting it into smaller, focused PRs.
            Large PRs are harder to review thoroughly and more likely to introduce bugs.

  # ── 3. Auto-assign PR to the author ────────────────────────────────────
  auto-assign:
    name: Auto Assign
    runs-on: ubuntu-latest
    steps:
      - name: Auto-assign PR to author
        uses: toshimaru/auto-author-assign@v2.1.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}