# .github/workflows/stale.yml
# ───────────────────────────────────────────────────────────────────────────
# Auto-marks and closes stale issues and PRs.
#
# Issues:
#   Stale warning after 30 days of inactivity
#   Closed after 7 more days with no response (37 days total)
#
# Pull Requests:
#   Stale warning after 14 days of inactivity
#   Closed after 7 more days with no response (21 days total)
#
# Runs daily at 01:00 UTC (06:45 NPT).
# Can also be triggered manually from the Actions tab.
# ───────────────────────────────────────────────────────────────────────────

name: Stale Issues & PRs

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  stale:
    name: Mark and Close Stale Items
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Handle stale issues and PRs
        uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # ── Issues ─────────────────────────────────────────────────────────
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: 'stale'
          stale-issue-message: |
            This issue has had no activity for 30 days.

            If it is still relevant, please leave a comment to keep it open.
            It will be closed in 7 days if there is no response.
          close-issue-message: |
            Closing due to inactivity.
            If this issue is still relevant, please open a new one with updated context.

          # ── Pull Requests ──────────────────────────────────────────────────
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          stale-pr-message: |
            This PR has had no activity for 14 days.

            Please update it or leave a comment if you plan to continue working on it.
            It will be closed in 7 days if there is no response.
          close-pr-message: |
            Closing this PR due to inactivity. The branch can be restored if needed.

          # ── Exemptions ───────────────────────────────────────────────────────
          exempt-issue-labels: 'pinned,security,in-progress,blocked'
          exempt-pr-labels: 'pinned,security,in-progress,blocked,dependencies'
          exempt-draft-pr: true